# GitHub Actions definition for CI build.

name: CI Build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  WinBuildTest:
    name: Windows build and test (${{ matrix.framework }}, ${{ matrix.architecture }})
    runs-on: windows-2022  # 2019 is not sufficient, Windows 21H1+ is best for ReFS bug fixes
    strategy:
      fail-fast: false
      matrix:
        framework: [net10.0, net11.0]
        architecture: [x64, x86]
        include:
          - architecture: x64
            project: tests\unit\64bit\CopyOnWriteTests.csproj
          - architecture: x86
            project: tests\unit\32bit\CopyOnWriteTests32.csproj
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      - name: Setup x86 .NET SDKs
        if: matrix.architecture == 'x86'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
          global-json-file: global.json
          architecture: x86
      - name: Setup x64 .NET SDKs
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
          global-json-file: global.json
          architecture: x64
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - name: Shrink C drive and create a ReFS E drive, then run tests
        run: |
          mkdir c:\ReFS
          dir c:\

          echo SELECT VOLUME C:                          >DiskPartScript.txt
          echo SHRINK DESIRED=10240                     >>DiskPartScript.txt
          echo CREATE PARTITION PRIMARY                 >>DiskPartScript.txt
          echo LIST PARTITION                           >>DiskPartScript.txt
          echo FORMAT QUICK FS=ReFS LABEL="ReFS Test"   >>DiskPartScript.txt
          echo ASSIGN LETTER=E                          >>DiskPartScript.txt
          echo LIST VOLUME                              >>DiskPartScript.txt
          echo ASSIGN MOUNT=C:\ReFS                     >>DiskPartScript.txt

          diskpart /s DiskPartScript.txt
          if not exist E:\ echo ERROR: diskpart failed && exit /b 1
          if not exist C:\ReFS echo ERROR: diskpart failed && exit /b 1

          @rem CODESYNC: WindowsReFSDriveSession.cs
          set CoW_Test_ReFS_Drive=E:\

          if "${{ matrix.architecture }}"=="x86" set "DOTNET_ROOT_X86=%ProgramFiles%\dotnet\x86"
          if "${{ matrix.architecture }}"=="x86" set "DOTNET_ROOT(x86)=%ProgramFiles%\dotnet\x86"
          dotnet test "${{ matrix.project }}" --configuration Release --framework ${{ matrix.framework }} --no-build --no-restore -- RunConfiguration.TreatNoTestsAsError=true
          if errorlevel 1 exit /b 1
        shell: cmd
